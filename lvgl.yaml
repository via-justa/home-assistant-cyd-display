image:
  - file: "${BG_IMAGE}"
    id: bg_home
    type: RGB565


lvgl:
  buffer_size: 25%
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: ts_touch

  style_definitions:
    - id: style_tile
      bg_color: 0xFFFFFF
      bg_opa: 95%
      radius: 18
      border_width: 0
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8
      shadow_width: 0
      shadow_opa: 40%

    - id: style_tile_disabled
      bg_color: 0x939391
      bg_opa: 95%
      radius: 18
      border_width: 0
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8
      shadow_width: 0
      shadow_opa: 25%

    - id: style_icon_circle
      bg_color: 0xFEC600
      bg_opa: COVER
      radius: 999
      border_width: 0

    - id: style_icon_circle_disabled
      bg_color: 0x7B7B6F
      bg_opa: 95%
      radius: 999
      border_width: 0

    - id: style_room
      text_font: headline
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_time
      text_font: time_label
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_title
      text_font: label
      text_color: 0x000000
      text_opa: 100%

    - id: style_value
      text_font: sublabel
      text_color: 0x7A7A7C
      text_opa: 100%

    - id: style_value_big
      text_font: sublabel_big
      text_color: 0xFFFFFF
      text_opa: 80%

    - id: style_title_disabled
      text_font: label
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_value_disabled
      text_font: sublabel
      text_color: 0xD9D9D9
      text_opa: 100%

    - id: style_play_indicator
      text_font: mdi_header
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_weather_icon
      text_font: mdi_weather
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_weather_temp
      text_font: headline
      text_color: 0xFFFFFF
      text_opa: 100%

  pages:
    - id: home_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      scrollbar_mode: 'OFF'
      widgets:
        - image:
            id: bg
            src: bg_home
            x: 0
            y: 0

        - label:
            id: lbl_play_indicator
            x: 11
            y: "16"
            text: "${MDI_MEDIA_PLAY}"
            styles: style_play_indicator
            hidden: true
            clickable: false

        - label:
            id: lbl_room
            x: 30
            y: ${HEADER_Y}
            text: "${ROOM_NAME}"
            styles: style_room
            long_mode: SCROLL_CIRCULAR
            # AUTO base_dir: detects RTL from Hebrew text so circular scroll
            # runs to the right; stays LTR (scroll left) for Latin text.
            base_dir: AUTO
            width: 155

        - label:
            id: lbl_weather_temp
            x: 206
            y: ${HEADER_Y}
            text: ""
            styles: style_weather_temp
            clickable: false

        - label:
            id: lbl_weather_icon
            x: 234
            y: "16"
            text: ""
            styles: style_weather_icon
            clickable: false

        - label:
            id: lbl_time
            align: TOP_RIGHT
            x: -11
            y: ${HEADER_Y}
            text: ""
            styles: style_time

        # ---------- TILE 1 ----------
        - obj:
            id: tile1
            x: ${GRID_COL1_X}
            y: ${GRID_ROW1_Y}
            width: ${TILE_W}
            height: ${TILE_H}
            styles: style_tile
            scrollable: false
            scrollbar_mode: 'OFF'
            widgets:
              - obj:
                  id: tile1_icon_circle
                  x: ${TILE_ICON_X}
                  y: ${TILE_ICON_Y}
                  width: 36
                  height: 36
                  styles: style_icon_circle
                  clickable: false
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  widgets:
                    - label:
                        id: tile1_icon_lbl
                        align: CENTER
                        text_font: materialdesign_icons
                        text_color: 0xFFFFFF
                        text: "${TILE1_ICON}"
                        clickable: false
              - label:
                  id: t1_title
                  x: ${TILE_TITLE_X}
                  y: ${TILE_TITLE_Y}
                  text: "${TILE1_TITLE}"
                  styles: style_title
                  clickable: false
              - label:
                  id: t1_value
                  x: ${TILE_VALUE_X}
                  y: ${TILE_VALUE_Y}
                  text: "—"
                  styles: style_value
                  clickable: false
            on_short_click:
              - script.execute: { id: publish_action, action: "tile1_press" }
              - script.execute:
                  id: do_tile_action
                  tile_type: "${TILE1_TYPE}"
                  tap_action: "${TILE1_TAP_ACTION}"
                  service: "${TILE1_TAP_SERVICE}"
                  entity_id: "${TILE1_ENTITY}"
                  param_key: "${TILE1_TAP_PARAM_KEY}"
                  param_val: "${TILE1_TAP_PARAM_VAL}"
                  was_on: !lambda |-
                    if (std::string("${TILE1_TYPE}") == "cover")
                      return id(tile1_cover_state).state != "closed";
                    return id(ha_state_tile1).state;
            on_long_press:
              - script.execute: { id: publish_action, action: "tile1_long_press" }
              - if:
                  condition:
                    lambda: "return std::string(\"${TILE1_LONGPRESS}\") == \"action\";"
                  then:
                    - script.execute:
                        id: do_tile_action
                        tile_type: !lambda |-
                          std::string t = "${TILE1_LONGPRESS_ACTION_TYPE}";
                          return t.empty() ? std::string("${TILE1_TYPE}") : t;
                        tap_action: "activate"
                        service: "${TILE1_LONGPRESS_ACTION_SERVICE}"
                        entity_id: "${TILE1_LONGPRESS_ACTION}"
                        param_key: ""
                        param_val: ""
                        was_on: false
                  else:
                    - if:
                        condition:
                          lambda: "return std::string(\"${TILE1_LONGPRESS}\") == \"slider\";"
                        then:
                          - script.execute:
                              id: open_value_overlay
                              title: "${TILE1_TITLE}"
                              entity: "${TILE1_ENTITY}"
                              tile_type: "${TILE1_TYPE}"
                              longpress_mode: "${TILE1_LONGPRESS_SLIDER}"
                              was_on: !lambda |-
                                if (std::string("${TILE1_TYPE}") == "cover")
                                  return id(tile1_cover_state).state != "closed";
                                return id(ha_state_tile1).state;
                              off_value: !lambda "return atoi(\"${TILE1_LONGPRESS_OFF_VALUE}\");"
                              brightness_value: !lambda "return id(tile1_brightness).state;"
                              percentage_value: !lambda "return id(tile1_percentage).state;"
                              position_value: !lambda "return id(tile1_cover_position).state;"
                              temp_min: 5.0
                              temp_max: 25.0
                              icon_text: "${TILE1_ICON}"
                              slider_bg_color: ${TILE1_BG_DISABLED_COLOR}
                              slider_fill_color: ${TILE1_CIRCLE_ACTIVE_COLOR}
                              slider_icon_color: ${TILE1_ICON_ACTIVE_COLOR}
                              label_off: "${TILE1_LABEL_OFF}"
                              label_on: "${TILE1_LABEL_ON}"

        # ---------- TILE 2 ----------
