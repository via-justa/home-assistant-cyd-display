                              percentage_value: !lambda "return id(tile4_percentage).state;"
                              position_value: !lambda "return id(tile4_cover_position).state;"
                              temp_min: !lambda "return atof(\"${TILE4_TEMP_MIN}\");"
                              temp_max: !lambda "return atof(\"${TILE4_TEMP_MAX}\");"
                              icon_text: "${TILE4_ICON}"
                              slider_bg_color: ${TILE4_BG_DISABLED_COLOR}
                              slider_fill_color: ${TILE4_CIRCLE_ACTIVE_COLOR}
                              slider_icon_color: ${TILE4_ICON_ACTIVE_COLOR}
                              label_off: "${TILE4_LABEL_OFF}"
                              label_on: "${TILE4_LABEL_ON}"

        # ---------- MEDIA PLAYER ROW ----------
        # Four equal buttons span the full bottom row (landscape: x=9..311 = 302px)
        # Each button is 71px wide with 6px gaps: x=9 | x=86 | x=163 | x=240
        # Icon circle is centered; icon changes for play/pause based on media player state.

        # --- Volume (opens the volume slider overlay) ---
        - obj:
            id: media_volume_btn
            x: 9
            y: ${GRID_ROW3_Y}
            width: 71
            height: ${TILE_H}
            styles: style_tile
            scrollable: false
            scrollbar_mode: 'OFF'
            widgets:
              - obj:
                  id: media_volume_circle
                  align: CENTER
                  width: 36
                  height: 36
                  styles: style_icon_circle
                  clickable: false
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  widgets:
                    - label:
                        id: media_volume_icon
                        align: CENTER
                        text_font: materialdesign_icons
                        text_color: 0xFFFFFF
                        text: "${MDI_MEDIA_VOLUME}"
                        clickable: false
            on_short_click:
              - script.execute: { id: publish_action, action: "media_volume_press" }
              - script.execute:
                  id: open_volume_overlay
                  volume_value: !lambda "return id(media_volume_level).state;"

        # --- Previous Track ---
        - obj:
            id: media_prev_btn
            x: 86
            y: ${GRID_ROW3_Y}
            width: 71
            height: ${TILE_H}
            styles: style_tile
            scrollable: false
            scrollbar_mode: 'OFF'
            widgets:
              - obj:
                  id: media_prev_circle
                  align: CENTER
                  width: 36
                  height: 36
                  styles: style_icon_circle
                  clickable: false
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  widgets:
                    - label:
                        id: media_prev_icon
                        align: CENTER
                        text_font: materialdesign_icons
                        text_color: 0xFFFFFF
                        text: "${MDI_MEDIA_PREV}"
                        clickable: false
            on_short_click:
              - script.execute: { id: publish_action, action: "media_prev_press" }
              - if:
                  condition:
                    lambda: "return std::string(\"${DIRECT_ACTIONS}\") == \"true\";"
                  then:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        data:
                          entity_id: "${MEDIA_ENTITY}"

        # --- Play / Pause (icon switches based on media player state) ---
        - obj:
            id: media_play_btn
            x: 163
            y: ${GRID_ROW3_Y}
            width: 71
            height: ${TILE_H}
            styles: style_tile
            scrollable: false
            scrollbar_mode: 'OFF'
            widgets:
              - obj:
                  id: media_play_circle
                  align: CENTER
                  width: 36
                  height: 36
                  styles: style_icon_circle
                  clickable: false
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  widgets:
                    - label:
                        id: media_play_icon
                        align: CENTER
                        text_font: materialdesign_icons
                        text_color: 0xFFFFFF
                        text: "${MDI_MEDIA_PLAY}"
                        clickable: false
            on_short_click:
              - script.execute: { id: publish_action, action: "media_play_pause_press" }
              - if:
                  condition:
                    lambda: "return std::string(\"${DIRECT_ACTIONS}\") == \"true\";"
                  then:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                          entity_id: "${MEDIA_ENTITY}"

        # --- Next Track ---
        - obj:
            id: media_next_btn
            x: 240
            y: ${GRID_ROW3_Y}
            width: 71
            height: ${TILE_H}
            styles: style_tile
            scrollable: false
            scrollbar_mode: 'OFF'
            widgets:
              - obj:
                  id: media_next_circle
                  align: CENTER
                  width: 36
                  height: 36
                  styles: style_icon_circle
                  clickable: false
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  widgets:
                    - label:
                        id: media_next_icon
                        align: CENTER
                        text_font: materialdesign_icons
                        text_color: 0xFFFFFF
                        text: "${MDI_MEDIA_NEXT}"
                        clickable: false
            on_short_click:
              - script.execute: { id: publish_action, action: "media_next_press" }
              - if:
                  condition:
                    lambda: "return std::string(\"${DIRECT_ACTIONS}\") == \"true\";"
                  then:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        data:
                          entity_id: "${MEDIA_ENTITY}"

        # ---------- VALUE SLIDER OVERLAY ----------
        - obj:
            id: brightness_overlay
            x: 0
            y: 0
            width: ${DISPLAY_W}
            height: ${DISPLAY_H}
            bg_opa: TRANSP
            hidden: true
            scrollable: false
            scrollbar_mode: 'OFF'
            pad_left: 0
            pad_right: 0
            pad_top: 0
            pad_bottom: 0
            border_width: 0
            widgets:
              - image:
                  id: brightness_overlay_bg
                  src: bg_home
                  x: 0
                  y: 0
                  clickable: true
                  on_click:
                    - lvgl.widget.hide: brightness_overlay

              - obj:
                  id: brightness_overlay_dim
                  x: 0
                  y: 0
                  width: ${DISPLAY_W}
                  height: ${DISPLAY_H}
                  bg_color: 0x000000
                  bg_opa: 18%
                  border_width: 0
                  clickable: false
                  scrollable: false

              - label:
                  id: overlay_title
                  align: TOP_MID
                  y: 10
                  text: "Light"
                  styles: style_room

              - label:
                  id: overlay_value
                  align: TOP_MID
                  y: 35
                  text: "100 %"
                  styles: style_value_big

              - slider:
                  id: overlay_slider
                  align: CENTER
                  y: 18
                  width: ${OVERLAY_SLIDER_W}
                  height: ${OVERLAY_SLIDER_H}
                  min_value: 0
                  max_value: 100
                  value: 100
                  adv_hittest: false

                  bg_color: 0x939391
                  bg_opa: 100%
                  radius: 28
                  border_width: 0

                  indicator:
                    bg_color: 0xFEC600
                    bg_opa: 100%
                    radius: 28

                  knob:
                    bg_opa: 0%
                    border_width: 0
                    shadow_width: 0
                    pad_all: 10

                  on_value:
                    - script.execute:
                        id: slider_preview
                        value: !lambda "return x;"

                  on_release:
                    - script.execute:
                        id: slider_commit
                        value: !lambda "return lv_slider_get_value(id(overlay_slider));"

                  widgets:
                    - label:
                        id: overlay_icon
                        align: BOTTOM_MID
                        y: -10
                        text_font: materialdesign_icons
                        text_color: 0xFFFFFF
                        text: "${TILE1_ICON}"
                        clickable: false
        # ---------- DIM / WAKE OVERLAY ----------
        - obj:
            id: dim_wake_overlay
            x: 0
            y: 0
            width: ${DISPLAY_W}
            height: ${DISPLAY_H}
            hidden: true
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            scrollbar_mode: 'OFF'
            clickable: true
            on_click:
              - script.execute: wake_display

